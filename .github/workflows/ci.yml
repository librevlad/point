name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accepts licenses, sets ANDROID_HOME)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Тесты экрана (#114) поднимают Android в JVM, и Robolectric тянет его образ (~100 МБ) в
      # ~/.m2 при первом прогоне. Кэш Gradle туда не достаёт — без этого шага образ приезжал бы
      # на каждый push.
      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.16.1

      - name: Build + unit tests (canonical gate)
        run: ./gradlew test assembleDebug --no-daemon --stacktrace

  # Сервер аккаунтов (#471) — Python, поэтому отдельной задачей: тянуть его в gradle-ворота
  # значило бы поставить Android-сборку в зависимость от pip. Тесты идут без сети и без
  # боевого сервера — вход по Google подменяется фейком того же шва.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt

      - name: Install server deps
        run: python -m pip install --quiet -r relay/requirements-dev.txt

      - name: Server tests
        working-directory: relay
        run: python -m pytest tests -q
