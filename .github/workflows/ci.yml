name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accepts licenses, sets ANDROID_HOME)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Тесты экрана (#114) поднимают Android в JVM, и Robolectric тянет его образ (~100 МБ) в
      # ~/.m2 при первом прогоне. Кэш Gradle туда не достаёт — без этого шага образ приезжал бы
      # на каждый push.
      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.16.1

      - name: Build + unit tests (canonical gate)
        run: ./gradlew test assembleDebug --no-daemon --stacktrace
