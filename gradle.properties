org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# configuration-cache is left off for now — some KSP/Hilt setups trip on it.
# Enable once the build is green: org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# compileSdk is 36 (only platform installed). If an older AGP flags 36 as
# "unsupported", uncomment the escape hatch below instead of downgrading:
# android.suppressUnsupportedCompileSdk=36
