org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# compileSdk is 36 (only platform installed). If an older AGP flags 36 as
# "unsupported", uncomment the escape hatch below instead of downgrading:
# android.suppressUnsupportedCompileSdk=36

# Версия Point — одна на телефон и компьютер (#886). Раньше телефон говорил «0.3.0», а
# компьютер «3.0.0»: одна сборка под двумя номерами, и «у меня от шестого августа» не с чем
# было сверить. Релизный гейт сверяет тег именно с этим значением.
pointVersion=0.3.5
